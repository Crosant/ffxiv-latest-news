name: Update Maintenance Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run maintenance parser
        run: |
          python parse_maintenance.py
      
      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add LatestNews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update maintenance data - $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
